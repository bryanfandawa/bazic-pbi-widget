<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics Bot</title>
<style>
  :root {
    --ink:      #14202E;   /* deep slate-navy: header, primary text     */
    --ink-soft: #4A5B6B;   /* muted labels, timestamps                  */
    --surface:  #EEF2F6;   /* cool panel background                     */
    --bot-bg:   #FFFFFF;   /* bot message bubble                        */
    --user-bg:  #1E3A52;   /* user message bubble                       */
    --accent:   #E8A33D;   /* warm amber: the one bold color            */
    --line:     #D6DEE6;   /* hairline borders                          */
    --good:     #3FB27F;   /* live status dot                           */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--surface);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 560px; margin: 0 auto;
    background: var(--surface);
  }

  /* ---- Header ---- */
  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    background: var(--ink); color: #fff;
    border-bottom: 3px solid var(--accent);
  }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--accent); color: var(--ink);
    display: grid; place-items: center;
    font-weight: 800; font-size: 15px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .bar h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #9FB0C0; margin-top: 1px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

  /* ---- Message log ---- */
  .log {
    flex: 1; overflow-y: auto;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }

  .row { display: flex; }
  .row.bot  { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }

  .bubble {
    max-width: 86%;
    padding: 11px 13px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
    animation: rise .22s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

  .row.bot .bubble {
    background: var(--bot-bg); border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    /* monospace keeps any tabular data the backend returns column-aligned */
    font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Code", monospace;
    font-size: 12.5px;
  }
  .row.user .bubble {
    background: var(--user-bg); color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* ---- Menu chips (the keypad) ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; padding-left: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    color: var(--ink); font-size: 12.5px; font-weight: 550;
    cursor: pointer; transition: border-color .15s, transform .05s, box-shadow .15s;
  }
  .chip:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(20,32,46,.08); }
  .chip:active { transform: translateY(1px); }
  .chip .num {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    display: grid; place-items: center;
    background: var(--ink); color: var(--accent);
    font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 12px;
  }

  /* ---- Composer ---- */
  .composer {
    display: flex; gap: 8px; padding: 12px 14px;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 13.5px; background: #fff; color: var(--ink);
    outline: none; transition: border-color .15s;
  }
  .composer input:focus { border-color: var(--accent); }
  .send {
    padding: 0 16px; border: none; border-radius: 10px;
    background: var(--ink); color: #fff;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .send:hover { background: #20344A; }
  .send:disabled { opacity: .5; cursor: default; }

  .typing { font-style: italic; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <div class="mark">∑</div>
      <div>
        <h1>Analytics Bot</h1>
        <div class="status"><span class="dot"></span><span id="who">connecting…</span></div>
      </div>
    </div>

    <div class="log" id="log"></div>

    <div class="composer">
      <input id="input" type="text" placeholder="Type a number, or ask the AI…" autocomplete="off" />
      <button class="send" id="send">Send</button>
    </div>
  </div>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
  // ===== CONFIG =====
  const BACKEND_URL = "https://bazic-chatbot-367872850152.us-central1.run.app/chat";

  // Microsoft sign-in. These IDs are public identifiers (safe to expose here).
  const msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: "8c0ee60a-1f5e-4649-8b20-ac0712012bfe",
      authority: "https://login.microsoftonline.com/8d92727f-edd8-4db8-bfda-9790656d5722",
      redirectUri: "https://bryanfandawa.github.io/bazic-pbi-widget/",
    },
    cache: { cacheLocation: "sessionStorage" },
  });
  const SCOPES = ["openid", "profile"];

  // Only "mode" still comes from the URL. Identity now comes from Microsoft sign-in,
  // not the URL — so a hand-typed ?email= can no longer fake who you are.
  const params = new URLSearchParams(location.search);
  const MODE = params.get("mode") || "";

  const log   = document.getElementById("log");
  const input = document.getElementById("input");
  const send  = document.getElementById("send");
  const who   = document.getElementById("who");

  if (MODE) input.placeholder = "Ask about " + MODE + " data…";

  let cachedToken = null;
  async function trySilent() {
    const account = msalInstance.getAllAccounts()[0];
    try {
      const result = await msalInstance.ssoSilent(
        account ? { scopes: SCOPES, loginHint: account.username } : { scopes: SCOPES }
      );
      cachedToken = result.idToken;
      who.textContent = (result.account && (result.account.name || result.account.username)) || "signed in";
      return true;
    } catch (e) {
      console.warn("Silent sign-in unavailable:", e.message || e);
      return false;
    }
  }
  async function interactiveSignIn() {
    const result = await msalInstance.loginPopup({ scopes: SCOPES });
    cachedToken = result.idToken;
    who.textContent = (result.account && (result.account.name || result.account.username)) || "signed in";
  }

  function addBubble(text, role) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  function addChips(buttons) {
    if (!buttons || !buttons.length) return;
    const wrap = document.createElement("div");
    wrap.className = "chips";
    buttons.forEach(([num, label]) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.innerHTML = `<span class="num">${num}</span><span>${label}</span>`;
      chip.onclick = () => sendMessage(String(num), { silent: false });
      wrap.appendChild(chip);
    });
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  let busy = false;
  async function sendMessage(text, { silent } = { silent: false }) {
    if (busy) return;
    if (!silent) addBubble(text, "user");

    busy = true; send.disabled = true;
    const typing = addBubble("…", "bot");
    typing.classList.add("typing");

    try {
      let res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cachedToken },
        body: JSON.stringify({ message: text, mode: MODE }),
      });
      if (res.status === 401) {
        // token expired or rejected — refresh once and retry
        const ok = await trySilent();
        if (!ok) { try { await interactiveSignIn(); } catch (_) {} }
        res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cachedToken },
          body: JSON.stringify({ message: text, mode: MODE }),
        });
      }
      if (!res.ok) {
        const detail = await res.text();
        console.error("Backend error", res.status, detail);   // visible in DevTools console
        throw new Error("HTTP " + res.status);
      }
      const data = await res.json();
      typing.remove();
      addBubble(data.text || "", "bot");
      addChips(data.buttons);
    } catch (e) {
      console.error("Request failed:", e);   // visible in DevTools console
      typing.remove();
      addBubble("Something went wrong reaching the assistant. Make sure you're signed in, then try again.", "bot");
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  send.onclick = () => {
    const t = input.value.trim();
    if (!t) return;
    input.value = "";
    sendMessage(t, { silent: false });
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send.onclick(); });

  // ===== Startup: sign in, then load the bot =====
  input.disabled = true; send.disabled = true;
  who.textContent = "signing in…";

  function showSignInButton() {
    const wrap = document.createElement("div");
    wrap.className = "chips";
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.innerHTML = '<span class="num">→</span><span>Sign in with Microsoft</span>';
    btn.onclick = async () => {
      try {
        await interactiveSignIn();
        wrap.remove();
        input.disabled = false; send.disabled = false;
        sendMessage("", { silent: true });
      } catch (e) {
        console.error("Sign-in failed:", e);
        addBubble("Sign-in didn't complete. Please try again.", "bot");
      }
    };
    wrap.appendChild(btn);
    log.appendChild(wrap);
  }

  (async () => {
    const ok = await trySilent();   // silent if already signed into Microsoft
    if (ok) {
      input.disabled = false; send.disabled = false;
      sendMessage("", { silent: true });
    } else {
      who.textContent = "sign-in needed";
      addBubble("Please sign in with your Microsoft account to use the assistant.", "bot");
      showSignInButton();
    }
  })();
</script>
</body>
</html>
